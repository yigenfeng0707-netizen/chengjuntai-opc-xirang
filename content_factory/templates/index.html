<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成军台 · 息壤育智 · 一人成军</title>
<style>
:root{
  --ink:#0f1c2e; --teal:#0d9488; --teal-d:#0f766e; --sand:#f4f1ea; --line:#d6dde6;
  --ok:#15803d; --warn:#b45309; --err:#b91c1c; --card:#fff; --muted:#64748b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#e8f3f1 0%,var(--sand) 45%,#eef2f7 100%);color:var(--ink);min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;background:rgba(15,28,46,.92);color:#fff;backdrop-filter:blur(8px)}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-size:20px;font-weight:700;letter-spacing:.02em}
.brand span{font-size:12px;opacity:.75}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(13,148,136,.25);border:1px solid rgba(45,212,191,.45);padding:6px 12px;border-radius:999px;font-size:12px}
.badge .dot{width:8px;height:8px;border-radius:50%;background:#2dd4bf}
.layout{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 64px)}
.sidebar{background:rgba(255,255,255,.72);border-right:1px solid var(--line);padding:16px 0}
.sidebar a{display:block;padding:12px 22px;color:#334155;text-decoration:none;border-left:3px solid transparent;cursor:pointer}
.sidebar a:hover{background:rgba(13,148,136,.08)}
.sidebar a.active{color:var(--teal-d);border-left-color:var(--teal);background:rgba(13,148,136,.1);font-weight:600}
.main{padding:22px;overflow:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(15,28,46,.04)}
.card h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:4px;height:16px;background:var(--teal);border-radius:2px}
.btn{display:inline-block;padding:8px 16px;background:var(--teal);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;margin-right:8px}
.btn:hover{background:var(--teal-d)}
.btn.gray{background:#64748b}
.btn.ghost{background:transparent;color:var(--teal-d);border:1px solid var(--teal)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{background:var(--err)}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{padding:10px;text-align:left;border-bottom:1px solid #eef2f7;font-size:13px;vertical-align:top}
th{color:var(--muted);font-weight:600;background:#f8fafc}
.tag{display:inline-block;background:#ccfbf1;color:#0f766e;padding:2px 8px;border-radius:999px;font-size:12px;margin-right:4px}
input,select,textarea{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;width:100%;background:#fff}
textarea{min-height:88px;resize:vertical}
.row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.row .col{flex:1;min-width:180px}
.muted{color:var(--muted);font-size:12px}
.status-ok{color:var(--ok)}.status-warn{color:var(--warn)}.status-err{color:var(--err)}
.banner{padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:13px;line-height:1.5}
.banner.warn{background:#fff7ed;border:1px solid #fdba74;color:#9a3412}
.banner.ok{background:#ecfdf5;border:1px solid #6ee7b7;color:#065f46}
.login{max-width:380px;margin:10vh auto;background:#fff;padding:32px;border-radius:16px;box-shadow:0 16px 40px rgba(15,28,46,.1)}
.login h2{text-align:center;margin-bottom:8px}
.login .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.metric{background:linear-gradient(180deg,#f0fdfa,#fff);border:1px solid #99f6e4;border-radius:12px;padding:14px}
.metric b{display:block;font-size:22px;color:var(--teal-d)}
.metric span{font-size:12px;color:var(--muted)}
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.col-board{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:160px}
.col-board h3{font-size:13px;margin-bottom:10px;color:var(--muted)}
.task{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;font-size:12px}
.task .role{color:var(--teal-d);font-weight:600}
.hero-goal{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.pre{white-space:pre-wrap;background:#0f1c2e;color:#a7f3d0;padding:14px;border-radius:10px;max-height:420px;overflow:auto;font-size:12px;line-height:1.55}
.logbox{background:#0f1c2e;color:#86efac;padding:12px;border-radius:10px;font-family:Consolas,monospace;font-size:12px;max-height:380px;overflow:auto;white-space:pre-wrap}
.value-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-bottom:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.value-strip .step{padding:14px 16px;border-right:1px solid var(--line);font-size:13px;line-height:1.45}
.value-strip .step:last-child{border-right:none}
.value-strip .step b{display:block;color:var(--teal-d);margin-bottom:4px;font-size:12px;letter-spacing:.04em}
.opc-claim{margin:0 0 14px;padding:16px 18px;border-radius:14px;background:linear-gradient(135deg,#0f172a 0%,#134e4a 70%);color:#ecfdf5}
.opc-claim h2{margin:0 0 6px;font-size:18px;color:#fff;font-weight:700}
.opc-claim p{margin:0;font-size:13px;line-height:1.5;color:rgba(236,253,245,.88)}
.week-story{margin:0 0 14px;padding:12px 14px;border-radius:12px;border:1px solid #99f6e4;background:#f0fdfa;font-size:13px;line-height:1.5;color:#0f766e}
.week-story b{color:#115e59}
.art-drawer{border:2px solid var(--teal);border-radius:14px;padding:14px;background:linear-gradient(180deg,#f0fdfa,#fff);margin-bottom:16px}
.art-drawer h2{margin-bottom:10px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:8px}
.tabs button{background:transparent;border:1px solid transparent;color:var(--muted);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:12px}
.tabs button:hover{background:rgba(13,148,136,.08);color:var(--teal-d)}
.tabs button.active{background:rgba(13,148,136,.12);border-color:#99f6e4;color:var(--teal-d);font-weight:600}
.q-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin:10px 0 14px}
.q-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff;font-size:12px;line-height:1.4;text-align:left}
.q-card:hover{border-color:var(--teal);background:#f0fdfa}
.bar-chart{margin-top:12px}
.bar-row{display:grid;grid-template-columns:100px 1fr 48px;gap:8px;align-items:center;margin-bottom:6px;font-size:12px}
.bar-track{background:#e2e8f0;border-radius:999px;height:10px;overflow:hidden}
.bar-fill{background:linear-gradient(90deg,var(--teal),#2dd4bf);height:100%;border-radius:999px}
.check-list{list-style:none;margin:8px 0}
.check-list li{padding:6px 0;border-bottom:1px dashed #e2e8f0;font-size:13px}
.check-list li::before{content:"☐ ";color:var(--teal-d)}
.ftab-pane{display:none}.ftab-pane.show{display:block}
.preview-pane{border:1px solid var(--line);border-radius:10px;padding:12px;background:#f8fafc;margin-top:10px}
.table-wrap{overflow:auto}
.btn.judge-cta{width:100%;margin-top:14px;padding:14px 16px;font-size:15px;font-weight:700;background:linear-gradient(135deg,#0d9488,#0f766e);box-shadow:0 8px 20px rgba(13,148,136,.35);letter-spacing:.02em}
.btn.judge-cta:hover{filter:brightness(1.05)}
.btn.judge-cta.home{width:auto;margin:0;padding:12px 22px;font-size:14px}
.judge-guide{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;margin-bottom:14px;border-radius:12px;background:linear-gradient(90deg,#0f766e,#0d9488);color:#fff;box-shadow:0 10px 28px rgba(15,28,46,.18)}
.judge-guide b{font-size:13px;margin-right:6px}
.judge-guide .btn{background:#fff;color:#0f766e;border:none;font-weight:600}
.judge-guide .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55)}
.judge-guide .muted{color:rgba(255,255,255,.85)}
.toast-host{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:min(420px,92vw);pointer-events:none}
.toast{pointer-events:auto;padding:12px 14px;border-radius:12px;background:#0f172a;color:#ecfdf5;font-size:13px;line-height:1.45;box-shadow:0 12px 32px rgba(15,28,46,.28);border:1px solid rgba(45,212,191,.35);animation:toastIn .25s ease}
.toast.warn{background:#7c2d12;border-color:#fdba74;color:#fff7ed}
.toast .toast-x{float:right;margin-left:10px;cursor:pointer;opacity:.7;border:none;background:transparent;color:inherit;font-size:14px}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.story-rail{margin:0 0 14px;padding:14px 16px;border-radius:14px;border:1px solid #99f6e4;background:linear-gradient(120deg,#f0fdfa,#fff);font-size:13px;line-height:1.5}
.story-rail b{color:#0f766e}
.story-rail .muted{margin-top:6px}
@media(max-width:840px){.layout{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;border-right:none;border-bottom:1px solid var(--line)}.sidebar a{white-space:nowrap}.hero-goal{grid-template-columns:1fr}.value-strip{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
  <div class="brand">
    <h1>成军台</h1>
    <span>息壤育智 · 一人成军｜OPC OS on 息壤</span>
  </div>
  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
    <div class="badge" id="modelBadge" title="模型与进程内累计 Token"><span class="dot"></span><span id="modelText">模型检测中…</span></div>
    <div class="badge" id="tokenBadge" title="本进程累计 LLM Token（网关返回 usage 时累加）"><span class="dot"></span><span id="tokenText">Token …</span></div>
    <div class="badge" id="mcpBadge" title="stdio MCP：战役 + 内容工厂（见 README / mcp.json）"><span class="dot"></span><span id="mcpText">MCP…</span></div>
    <div class="muted" id="userBox" style="color:#cbd5e1">未登录</div>
  </div>
</div>

<div class="layout" id="appBox" style="display:none">
  <div class="sidebar">
    <a class="nav active" data-v="home">成军看板</a>
    <a class="nav" data-v="campaigns">战役列表</a>
    <a class="nav" data-v="artifacts">产物中心</a>
    <a class="nav" data-v="nl2sql">智能问数</a>
    <a class="nav" data-v="bid">标书工作台</a>
    <a class="nav" data-v="metrics">成效指标</a>
    <a class="nav" data-v="factory">内容工厂</a>
    <a class="nav" data-v="logs">系统日志</a>
    <a class="nav" data-v="users">权限管理</a>
    <a class="nav admin-only" data-v="insights" style="display:none">用户洞察</a>
  </div>
  <div class="main" id="content"></div>
</div>

<div id="toastHost" class="toast-host" aria-live="polite"></div>
<div id="loginBox" class="login">
  <h2>成军台</h2>
  <p style="margin:-4px 0 10px;text-align:center;font-size:15px;font-weight:600;color:#0f766e;line-height:1.4">缺编辑部的一人公司 · 内容成军闭环</p>
  <p class="sub" id="loginSub">惠民 · AI+自选开放场景｜支持邮箱登录｜检测模型配置…</p>
  <div id="loginBanner"></div>
  <button type="button" class="btn judge-cta" id="loginJudgeCta" onclick="startJudge60sFromLogin()">评委 60 秒体验</button>
  <p class="muted" style="margin:8px 0 16px;text-align:center;line-height:1.45">零讲解一条路：样例战役 → Word 周报 → 问数一表<br>（只读评委自动登录 · 无需找侧栏）</p>
  <div id="loginForm">
    <div class="row"><div class="col"><input id="lu" placeholder="邮箱或用户名" value="" autocomplete="username"></div></div>
    <div class="row"><div class="col"><input id="lp" type="password" placeholder="密码" value="" autocomplete="current-password"></div></div>
    <button class="btn" style="width:100%" onclick="doLogin()">进入成军</button>
    <p class="muted" style="margin-top:12px;text-align:center">还没有账号？<a href="#" onclick="toggleAuthMode('register');return false;">邮箱注册</a></p>
    <p class="muted" style="margin-top:6px;text-align:center">评委只读：judge / judge2026</p>
  </div>
  <div id="registerForm" style="display:none">
    <div class="row"><div class="col"><input id="re" type="email" placeholder="邮箱" autocomplete="email"></div></div>
    <div class="row"><div class="col"><input id="rn" placeholder="显示名（可选）"></div></div>
    <div class="row"><div class="col"><input id="rp" type="password" placeholder="密码（至少6位）" autocomplete="new-password"></div></div>
    <button class="btn" style="width:100%" onclick="doRegister()">注册并登录</button>
    <p class="muted" style="margin-top:12px;text-align:center">已有账号？<a href="#" onclick="toggleAuthMode('login');return false;">返回登录</a></p>
  </div>
</div>

<script>
let TOKEN='',ROLE='',USER='',EMAIL='', CURRENT=null, _viewSeq=0, _selUser='';
let _pendingJudge60=false, _judgeGuideOn=false;
const JUDGE_DEMO_IDS=['CMP_DEMO_WEEK_LEAD','CMP_DEMO_LEAD_01','CMP_DEMO_WEEK_BRIEF','CMP_DEMO_BRIEF_01'];
const JUDGE_NL_Q='各行业中标项目数量和金额合计';
const JUDGE_NL_SAMPLE={
  columns:['行业','项目数','金额合计(万元)'],
  rows:[['云计算',12,8600],['网络安全',9,4200],['IDC/算力',7,15100],['数字化转型',15,6800],['智慧城市',6,3900]],
  note:'离线缓存样例表（非实时查询）· 启动 scripts/start_real_data.bat 后可点预设卡查真库'
};
function $(id){return document.getElementById(id);}
function setHTML(id,html){const el=$(id);if(!el){console.warn('setHTML skipped, missing #'+id);return false;}el.innerHTML=html;return true;}
async function api(path,opts){
  opts=opts||{};opts.headers=opts.headers||{};
  if(TOKEN)opts.headers['Authorization']='Bearer '+TOKEN;
  if(opts.body&&!opts.headers['Content-Type'])opts.headers['Content-Type']='application/json';
  let r;
  try{r=await fetch(path,opts);}catch(e){throw new Error('网络请求失败: '+(e&&e.message?e.message:e));}
  if(r.status===401){alert('登录失效');location.reload();throw new Error('登录失效');}
  const t=await r.text();
  let d;try{d=JSON.parse(t);}catch(e){d={error:t};}
  if(!r.ok){
    let msg=(d&&(d.detail!=null?d.detail:d.error))||t||('HTTP '+r.status);
    if(Array.isArray(msg)) msg=msg.map(x=>typeof x==='object'?(x.msg||x.message||JSON.stringify(x)):String(x)).join('; ');
    throw new Error(String(msg));
  }
  return d;
}
function asList(x){return Array.isArray(x)?x:[];}
function toggleAuthMode(mode){
  const lf=$('loginForm'),rf=$('registerForm');
  if(!lf||!rf) return;
  lf.style.display=mode==='register'?'none':'block';
  rf.style.display=mode==='register'?'block':'none';
}
function afterLogin(d){
  TOKEN=d.token;ROLE=d.role;USER=d.user;EMAIL=d.email||'';
  const box=$('loginBox'),app=$('appBox'),ub=$('userBox');
  if(box) box.style.display='none';
  if(app) app.style.display='grid';
  if(ub) ub.textContent=(EMAIL||USER)+' · '+ROLE;
  document.querySelectorAll('.admin-only').forEach(a=>{a.style.display=ROLE==='super_admin'?'block':'none';});
  refreshBadge();
  const wantJudge=_pendingJudge60 || (location.hash||'').indexOf('judge60')>=0;
  _pendingJudge60=false;
  if(wantJudge){ runJudge60sPath(); }
  else { nav('home'); }
}
function startJudge60sFromLogin(){
  const lu=$('lu'), lp=$('lp');
  if(lu) lu.value='judge';
  if(lp) lp.value='judge2026';
  _pendingJudge60=true;
  location.hash='judge60';
  fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({u:'judge',p:'judge2026'})})
    .then(r=>r.json()).then(d=>{
      if(d.token){ afterLogin(d); }
      else { _pendingJudge60=false; alert(d.error||'评委登录失败'); }
    })
    .catch(e=>{ _pendingJudge60=false; alert('评委登录失败: '+(e&&e.message?e.message:e)); });
}
function judgeGuideHtml(stepNote){
  return '<div class="judge-guide" id="judgeGuide">'+
    '<b>评委 60 秒</b><span class="muted">'+(stepNote||'样例战役 → Word → 问数')+'</span>'+
    '<button type="button" class="btn sm" onclick="judgeExportWord()">① 导出 Word</button>'+
    '<button type="button" class="btn sm ghost" onclick="judgeGoNl2sql()">② 智能问数一表</button>'+
    '<button type="button" class="btn sm ghost" onclick="dismissJudgeGuide()">关闭</button>'+
    '</div>';
}
function dismissJudgeGuide(){ _judgeGuideOn=false; const g=$('judgeGuide'); if(g) g.remove(); }
async function pickDemoCampaignId(){
  try{
    const list=asList(await api('/api/campaigns'));
    const ids=list.map(c=>c.id);
    for(let i=0;i<JUDGE_DEMO_IDS.length;i++){
      if(ids.indexOf(JUDGE_DEMO_IDS[i])>=0) return JUDGE_DEMO_IDS[i];
    }
    const done=list.find(c=>c.status==='completed'||(c.artifacts&&c.artifacts.length));
    if(done) return done.id;
    if(list[0]) return list[0].id;
  }catch(e){}
  return JUDGE_DEMO_IDS[0];
}
async function runJudge60sPath(){
  _judgeGuideOn=true;
  await nav('home');
  const cid=await pickDemoCampaignId();
  CURRENT=cid;
  try{
    await showCamp(cid);
  }catch(e){
    const panel=$('campPanel');
    if(panel) setHTML('campPanel', judgeGuideHtml('未找到样例战役')+card('<p class="status-err">'+esc(e.message)+'</p><p class="muted">请运行 <code>python scripts/seed_demo_week.py</code> 后 Ctrl+F5 重试。</p>','样例未就绪'));
    return;
  }
  const panel=$('campPanel');
  if(panel && !panel.querySelector('#judgeGuide')){
    panel.insertAdjacentHTML('afterbegin', judgeGuideHtml('已打开 '+cid+' · 先看产物，再导出 Word'));
  }
  const drawer=$('artDrawer');
  if(drawer) drawer.scrollIntoView({behavior:'smooth',block:'nearest'});
}
async function judgeExportWord(){
  const id=CURRENT||await pickDemoCampaignId();
  CURRENT=id;
  try{
    await exportWord(id);
    const g=$('judgeGuide');
    if(g) g.querySelector('.muted').textContent='Word 已触发 · 下一步点「智能问数一表」';
  }catch(e){ alert(e.message||e); }
}
async function judgeGoNl2sql(){
  window.__judgeNlPending=true;
  await nav('nl2sql');
}
function doLogin(){
  const lu=$('lu'),lp=$('lp');
  if(!lu||!lp){alert('登录表单未就绪');return;}
  const u=lu.value.trim(),p=lp.value;
  if(!u||!p){alert('请输入邮箱/用户名和密码');return;}
  fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({u,p})})
    .then(r=>r.json()).then(d=>{if(d.token){afterLogin(d);}else{alert(d.error||'登录失败');}})
    .catch(e=>alert('登录请求失败: '+(e&&e.message?e.message:e)));
}
function doRegister(){
  const email=($('re')&&$('re').value||'').trim();
  const password=$('rp')&&$('rp').value||'';
  const display_name=($('rn')&&$('rn').value||'').trim();
  if(!email||!password){alert('请填写邮箱和密码');return;}
  fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,display_name})})
    .then(r=>r.json()).then(d=>{
      if(d.error){alert(d.error);return;}
      return fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({u:email,p:password})}).then(r=>r.json());
    }).then(d=>{if(!d)return;if(d.token){afterLogin(d);}else{alert(d.error||'注册成功，请登录');toggleAuthMode('login');}})
    .catch(e=>alert('注册失败: '+(e&&e.message?e.message:e)));
}
document.querySelectorAll('.nav').forEach(a=>a.onclick=()=>nav(a.dataset.v));
async function nav(v){
  document.querySelectorAll('.nav').forEach(a=>a.classList.toggle('active',a.dataset.v===v));
  const seq=++_viewSeq;
  const fn={home:vHome,campaigns:vList,metrics:vMetrics,factory:vFactory,logs:vLogs,users:vUsers,insights:vInsights,artifacts:vArtifacts,nl2sql:vNl2sql,bid:vBid}[v];

function fmtTokens(n){
  n=Number(n||0);
  if(n>=1000000) return (n/1000000).toFixed(2)+'M';
  if(n>=1000) return (n/1000).toFixed(1)+'k';
  return String(n);
}
let _lastTokenTotal=-1;
let _tokenPollTimer=null;
function applyTokenUsage(tu){
  const tokEl=$('tokenText');
  const badge=$('tokenBadge');
  if(!tokEl) return;
  tu=tu||{};
  const total=Number(tu.total_tokens||0);
  const last=(tu.last&&tu.last.total_tokens)||0;
  const pt=Number(tu.prompt_tokens||0);
  const ct=Number(tu.completion_tokens||0);
  tokEl.textContent= total
    ? ('Token '+fmtTokens(total)+'（入'+fmtTokens(pt)+'/出'+fmtTokens(ct)+'）'+(last?(' · 上次 '+fmtTokens(last)):'') )
    : 'Token 0（LLM 调用后实时累计）';
  if(badge){
    badge.title='本进程累计 Token · 入站 '+pt+' · 出站 '+ct+' · 有 usage 的调用 '+(tu.calls_with_usage||0)+' 次（约每 2 秒刷新）';
    if(_lastTokenTotal>=0 && total>_lastTokenTotal){
      badge.style.boxShadow='0 0 0 2px rgba(45,212,191,.85)';
      setTimeout(function(){ if(badge) badge.style.boxShadow=''; }, 1200);
    }
  }
  _lastTokenTotal=total;
}
async function refreshBadge(){
  const el=$('modelText');
  const tokEl=$('tokenText');
  const mcpEl=$('mcpText');
  try{
    const r=await fetch('/api/health',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const h=await r.json();
    const llm=h.llm||{};
    const provs=llm.providers||[];
    const name=llm.active_name|| (provs[0]&&provs[0].name) || '未配置';
    const model=llm.active_model|| (provs[0]&&provs[0].model) || '-';
    if(el){
      if(llm.enabled && provs.length){ el.textContent=name+' / '+model; }
      else { el.textContent='⚠️ 无可用 LLM（禁止静默 mock）'; }
    }
    applyTokenUsage(llm.token_usage||{});
    const mcp=h.mcp||{};
    if(mcpEl){
      mcpEl.textContent=mcp.ready ? (mcp.label||'MCP 工具已就绪') : (mcp.label||'MCP 封装缺失');
    }
    updateLoginCopy(h);
    window.__HEALTH=h;
    return h;
  }catch(e){
    console.error('refreshBadge failed', e);
    if(el) el.textContent='健康检查失败';
    if(tokEl) tokEl.textContent='Token —';
    if(mcpEl) mcpEl.textContent='MCP 未知';
    const sub=$('loginSub');
    if(sub) sub.textContent='惠民 · AI+自选开放场景｜邮箱登录｜健康检查失败，请确认服务已启动';
    return null;
  }
}
function startTokenLivePoll(){
  if(_tokenPollTimer) return;
  _tokenPollTimer=setInterval(function(){
    refreshBadge().catch(function(){});
  }, 2000);
}

    '<div class="row"><div class="col"><input id="vq" placeholder="检索关键词，如：一人成军 / MCP / NL2SQL"></div>'+
    '<div class="col" style="max-width:120px"><button class="btn" onclick="doVSearch()">检索</button></div></div>'+

async function doVSearch(){
  const q=(($('vq')&&$('vq').value)||'').trim();
  if(!q){alert('请输入关键词');return;}
  setHTML('vbox','<p class="muted">检索中…</p>');
  try{
    const r=await api('/api/vector/search?q='+encodeURIComponent(q));
    const items=Array.isArray(r)?r:(r.results||r.hits||[]);
    if(!items.length){setHTML('vbox','<p class="muted">无命中 · '+esc(JSON.stringify(r).slice(0,200))+'</p>');return;}
    const rows=items.map(x=>'<tr><td>'+esc(x.id||x.doc_id||'')+'</td><td>'+esc(x.title||'')+'</td><td>'+esc(x.score!=null?Number(x.score).toFixed(3):'-')+'</td><td>'+esc((x.snippet||x.summary||x.text||'').toString().slice(0,120))+'</td></tr>').join('');
    setHTML('vbox','<div class="table-wrap"><table><tr><th>ID</th><th>标题</th><th>分数</th><th>摘要</th></tr>'+rows+'</table></div>');
  }catch(e){setHTML('vbox','<p class="status-err">'+esc(e.message)+'</p>');}
}
async function fTabSchedule(){
  const sch=await api('/api/schedule');
  let runtime=sch.runtime||null;
  try{ if(!runtime) runtime=await api('/api/schedule/status'); }catch(e){ runtime=null; }
  const tasks=(sch&&sch.tasks)!=null?sch.tasks:sch;
  const list=asList(tasks);
  const running=!!(runtime&&runtime.running);
  const statusBanner='<div class="banner '+(running?'ok':'warn')+'">调度器：'+(running?'<b>运行中</b>':'未启动')+
    (runtime&&runtime.embedded?' · Web 内嵌线程':'')+
    (runtime&&runtime.started_at?' · 自 '+esc(runtime.started_at):'')+
    ' · 启用 '+(runtime&&runtime.enabled_count!=null?runtime.enabled_count: '-')+'/'+(runtime&&runtime.task_count!=null?runtime.task_count:list.length)+
    (ROLE!=='guest'
      ? (running
        ? ' <button class="btn sm ghost" onclick="stopSchedRuntime()">停止内嵌</button>'
        : ' <button class="btn sm" onclick="startSchedRuntime()">启动调度器</button>')
      : '')+
    '</div>'+
    '<p class="muted" style="margin:0 0 10px">Windows 友好：Web 内嵌后台线程，或另开 <code>content_factory/start_scheduler.bat</code>（无需系统 cron）。</p>';
  const rows=list.map(t=>'<tr><td>'+esc(t.id)+'</td><td>'+esc(t.name||t.action)+'</td><td><code>'+esc(t.cron||'')+'</code></td>'+
    '<td>'+(t.enabled?'<span class="status-ok">启用</span>':'<span class="muted">停用</span>')+'</td><td>'+
    (ROLE!=='guest'
      ? '<button class="btn sm" onclick="toggleSched(\''+esc(t.id)+'\','+(!t.enabled)+')">'+(t.enabled?'停用':'启用')+'</button>'
      : '-')+'</td></tr>').join('');
  setHTML('factoryBody',statusBanner+card(
    '<div class="table-wrap"><table><tr><th>ID</th><th>名称</th><th>Cron</th><th>状态</th><th></th></tr>'+
    (rows||'<tr><td colspan=5 class=muted>无定时任务</td></tr>')+'</table></div>',
    '定时任务'));
}
async function startSchedRuntime(){
  try{
    const r=await api('/api/schedule/start',{method:'POST',body:'{}'});
    showToast(r.already?'调度器已在运行':'已启动内嵌调度器');
    await fTabSchedule();
  }catch(e){alert(e.message);}
}
async function stopSchedRuntime(){
  try{
    const r=await api('/api/schedule/stop',{method:'POST',body:'{}'});
    if(r.error) showToast(r.error,'warn'); else showToast('已请求停止内嵌调度器');
    await fTabSchedule();
  }catch(e){alert(e.message);}
}
async function toggleSched(id,enabled){

}

async function bidStartCamp(industry, template, projectName, projectId){
  if(ROLE==='guest'){alert('只读');return;}
  if(!industry){alert('无赛道');return;}
  const box=$('bidMainBox')||$('bidRefreshBox');
  if(box) box.innerHTML='<div class="banner warn">正在从标讯生成战役…</div>';
  showToast('标讯 → 战役生成中…');
  try{
    const r=await api('/api/bid/theme_to_campaign',{method:'POST',body:JSON.stringify({
      industry:industry, template:template||'lead_gen', auto_approve:false,
      project_name:projectName||'', project_id:projectId||''
    })});
    const cid=r.campaign_id||'';
    const isReal=String(projectId||'').indexOf('REAL_')===0;
    showToast('已成军 '+cid+(isReal?' · 真实标讯':'')+' · 正在打开看板');
    if(box) box.innerHTML='<div class="banner ok">已创建 <b>'+esc(cid)+'</b> · '+esc((r.goal||'').slice(0,80))+
      ' <button class="btn sm" onclick="navHomeOpen(\''+esc(cid)+'\')">打开看板</button></div>';
    await nav('home');
    if(cid){
      await openCamp(cid);
      // 引导条：人审 → 产物 → Word（丝滑路径）
      const panel=$('campPanel');
      if(panel){
        const guide=document.createElement('div');
        guide.className='judge-guide';
        guide.innerHTML='<b>标讯成军引导</b><span class="muted">'+esc((projectName||industry||'').slice(0,36))+'</span>'+
          '<button type="button" class="btn sm" onclick="approve(\''+esc(cid)+'\')">① 人审通过</button>'+
          '<button type="button" class="btn sm ghost" onclick="var d=$(\'artDrawer\');if(d)d.scrollIntoView({behavior:\'smooth\'})">② 产物抽屉</button>'+
          '<button type="button" class="btn sm ghost" onclick="exportWord(\''+esc(cid)+'\')">③ 导出 Word</button>';
        panel.insertBefore(guide, panel.firstChild);
      }
    }
  }catch(e){
    showToast(e.message||'成军失败','warn');
    if(box) box.innerHTML='<p class="status-err">'+esc(e.message)+'</p>';
    else alert(e.message);
  }
}

      requirements:_bidWs.requirements, matrix:_bidWs.matrix, project_name:_bidWs.projectName||''
    })});

function renderBarChart(cols, rows){
  if(!cols||!rows||!rows.length) return '';
  // 找第一个数值列
  let labelIdx=0, valIdx=-1;
  for(let j=0;j<cols.length;j++){
    const n=Number(rows[0][j]);
    if(!isNaN(n)&&rows[0][j]!==''&&rows[0][j]!=null){valIdx=j;break;}
  }
  if(valIdx<0) return '';
  if(valIdx===0&&cols.length>1){labelIdx=1;}
  const vals=rows.map(r=>Number(r[valIdx])||0);
  const max=Math.max.apply(null,vals.concat([1]));
  const bars=rows.slice(0,12).map(r=>{
    const v=Number(r[valIdx])||0;
    const pct=Math.round(v/max*100);
    const label=String(r[labelIdx]!=null?r[labelIdx]:'').slice(0,16);
    return '<div class="bar-row"><div>'+esc(label)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div><div>'+esc(v)+'</div></div>';
  }).join('');
  return '<div class="bar-chart"><p class="muted">简易柱状图 · '+esc(cols[valIdx])+'</p>'+bars+'</div>';
}
async function runNl2sql(){
  const q=(($('nlq')&&$('nlq').value)||'').trim();
  if(!q){alert('请输入问题');return;}
  setHTML('nlbox','<p class="muted">查询中…</p>');
  try{
    const r=await api('/api/nl2sql/query',{method:'POST',body:JSON.stringify({question:q})});
    if(!r.ok){
      setHTML('nlbox','<div class="banner warn">'+esc(r.error||'失败')+
        (r.offline?' <button class="btn sm" onclick="seedNl2sql()">写入演示库</button>':'')+'</div>');
      return;
    }
    const cols=r.columns||[];
    const head='<tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>';
    const body=(r.rows||[]).map(row=>'<tr>'+(row||[]).map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('');
    setHTML('nlbox',
      '<div class="banner ok">真实库结果 · 来源 '+esc(r.source)+' · 模式 '+esc(r.nl2sql_mode)+' · '+esc(r.row_count)+' 行</div>'+
      '<p class="muted"><code>'+esc(r.sql||'')+'</code></p>'+
      '<div class="table-wrap"><table>'+head+body+'</table></div>'+
      renderBarChart(cols, r.rows||[]));
  }catch(e){setHTML('nlbox','<p class="status-err">'+esc(e.message)+'</p>');}
}
