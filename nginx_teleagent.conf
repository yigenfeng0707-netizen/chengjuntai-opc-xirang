# ============================================================
# Nginx 配置 - opcopcos.cn (HTTPS, 8088 端口)
# 备注：国内 80/443 需 ICP 备案，运营商封禁未备案域名的 80/443。
#       8443 规则加错安全组，直接复用 8088 做 HTTPS（外网已通）。
# 证书路径: /etc/letsencrypt/live/opcopcos.cn/ (DNS-01 验证申请)
# ============================================================

# 限流区域定义
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# ---------- HTTPS(8088): 主服务 ----------
server {
    listen 8088 ssl http2;
    server_name opcopcos.cn;

    # SSL 证书 (certbot 通过 DNS-01 验证申请)
    ssl_certificate     /etc/letsencrypt/live/opcopcos.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opcopcos.cn/privkey.pem;

    # SSL 优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 50M;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Web 面板 (FastAPI, 8090) - 包含所有 /api/ 路由
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # NL2SQL Flask 后端 (8082) - 只匹配 /api/v1/（避免与 FastAPI /api/ 冲突）
    location /api/v1/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8082/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # MCP 服务 (aiohttp, 8765)
    location /mcp {
        proxy_pass http://127.0.0.1:8765/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 健康检查 (Flask, 8082)
    location /health {
        proxy_pass http://127.0.0.1:8082/health;
        access_log off;
    }
}
